<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>PixVerse Auto-Register</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>PixVerse Auto-Register</h1>
    <span id="status-pill" class="pill">idle</span>
  </header>

  <section class="controls">
    <button id="btn-start" class="primary">Registrierung starten</button>
    <button id="btn-stop">Stop</button>
    <button id="btn-poll" title="Inbox jetzt abfragen">Inbox jetzt</button>
    <button id="btn-clear">Clear</button>
  </section>

  <section class="repeat">
    <h2>Wiederholungen</h2>
    <div class="row">
      <label>Anzahl</label>
      <input id="f-repeat" type="number" min="1" max="100" value="1" />
      <span id="f-progress" class="progress">0 / 1</span>
    </div>
  </section>

  <section class="gen">
    <h2>Generierungen</h2>
    <div class="row">
      <label>Pro Account</label>
      <input id="f-gen-per-account" type="number" min="1" max="10" value="3" />
      <span id="f-gen-progress" class="progress">0 / 0</span>
    </div>
    <div class="row" style="flex-direction:column; align-items:stretch; gap:4px;">
      <label style="width:auto;">Prompts (CLIP-Blöcke werden automatisch getrennt)</label>
      <textarea id="f-gen-prompts" rows="6" placeholder="CLIP 1 (0–6s) — HOOK&#10;Animate uploaded image as ..."></textarea>
    </div>
    <div class="row" style="flex-direction:column; align-items:stretch; gap:4px;">
      <label style="width:auto;">Bilder (1 pro Prompt, gleiche Reihenfolge)</label>
      <input id="f-gen-images" type="file" accept="image/*" multiple />
      <span id="f-gen-counts" class="progress" style="margin-left:0;">0 Prompts · 0 Bilder</span>
    </div>
    <div class="row">
      <button id="btn-gen-start" class="primary" style="flex:1;">Generierungen starten</button>
      <button id="btn-gen-stop">Stop Gen</button>
    </div>
  </section>

  <section class="export">
    <h2>Account-Historie</h2>
    <div class="row">
      <span id="f-export-count" class="export-count">0 Accounts gespeichert</span>
      <button id="btn-export" class="primary" title="Alle gespeicherten Accounts als .txt herunterladen">Export .txt</button>
      <button id="btn-history-clear" title="Historie loeschen (unwiderruflich)">Loeschen</button>
    </div>
  </section>

  <section class="referral">
    <h2>Referral-Code</h2>
    <div class="row">
      <label>Code</label>
      <input id="f-referral" placeholder="Q1XJSEBM" />
      <button id="btn-claim" title="Referral jetzt einloesen (manuell, im aktiven Tab)">Claim</button>
    </div>
  </section>

  <section class="account">
    <h2>Account</h2>
    <div class="row"><label>Username</label><input id="f-user" readonly /><button class="copy" data-target="f-user">Kopieren</button></div>
    <div class="row"><label>E-Mail</label><input id="f-mail" readonly /><button class="copy" data-target="f-mail">Kopieren</button></div>
    <div class="row"><label>Passwort</label><input id="f-pass" readonly /><button class="copy" data-target="f-pass">Kopieren</button></div>
    <div class="row"><label>mail.tm Pass</label><input id="f-mailpass" readonly /><button class="copy" data-target="f-mailpass">Kopieren</button></div>
    <div class="row"><label>Domain</label><input id="f-domain" readonly /></div>
  </section>

  <section class="logs">
    <h2>Log</h2>
    <pre id="log"></pre>
  </section>

  <footer>
    <small>v1.0 - mail.tm + passive Turnstile</small>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
